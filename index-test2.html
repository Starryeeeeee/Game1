<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    color: #eaf7ff;
    user-select: none; -webkit-user-select: none;
  }

  #vanta-bg { position: fixed; inset: 0; z-index: 0; }

  #enterOverlay {
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(6, 12, 24, 0.94);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.1s ease;
  }
  #enterOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .enter-inner {
    display: flex;
    align-items: center;
    gap: 32px;
    animation: enterFadeIn 1.2s ease .3s both;
  }
  @keyframes enterFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .enter-pulse {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #b8d4f0;
    box-shadow: 0 0 24px rgba(140,200,255,.9);
    animation: enterPulse 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes enterPulse {
    0%, 100% {
      transform: scale(1);
      opacity: .6;
      box-shadow: 0 0 16px rgba(140,200,255,.7);
    }
    50% {
      transform: scale(1.5);
      opacity: 1;
      box-shadow: 0 0 44px rgba(140,200,255,1),
                  0 0 88px rgba(90,142,200,.6);
    }
  }

  .enter-text {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(36px, 4vw, 64px);
    letter-spacing: .08em;
    color: rgba(210,232,250,.95);
    text-shadow: 0 0 34px rgba(90,142,200,.55),
                 0 0 68px rgba(90,142,200,.25);
    line-height: 1;
  }

  #cover {
    position: fixed; inset: 0;
    z-index: 10;
    pointer-events: none;
    transition: opacity 1.5s ease .5s;
  }
  #cover.done { opacity: 0; }

  .cover-top {
    position: absolute;
    top: 13vh;
    left: 8vw;
    display: flex;
    align-items: center;
    gap: 28px;
    transition: transform 1.9s cubic-bezier(.6,.05,.2,1), opacity 1.6s ease;
  }
  .cover-top img {
    height: 118px;
    width: auto;
    filter: drop-shadow(0 0 22px rgba(90,142,200,.62));
  }

  /* ✅ 修改处1：将自定义字体应用到社团名字上 */
  .club-name {
    font-family: 'AliHYAiHei-Beta', "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 52px;
    font-weight: 400; /* 改为 400 适配单字重，避免强行拉伸变形 */
    letter-spacing: .24em;
    color: rgba(200,225,245,.92);
    text-shadow: 0 0 26px rgba(90,142,200,.42);
    line-height: 1;
    transform: translateY(-2px);
  }

  .title-group {
    position: absolute;
    left: 8vw;
    top: 49%;
    transform: translateY(-50%);
    max-width: 75vw;
    opacity: 0;
    transition: opacity .9s ease;
  }
  #cover.ready .title-group { opacity: 1; }

  .kicker {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(26px, 2.4vw, 40px);
    letter-spacing: .06em;
    color: rgba(180,212,240,.85);
    margin-bottom: 30px;
    transition: transform 1.9s cubic-bezier(.6,.05,.2,1), opacity 1.6s ease;
    min-height: 1.15em;
  }

  .typing-cursor {
    display: inline-block;
    width: 0.075em;
    height: 0.92em;
    vertical-align: -0.08em;
    margin-left: 0.1em;
    background: #b8d4f0;
    opacity: 0.9;
    animation: typingBlink .7s steps(1) infinite;
    transition: opacity .5s ease;
  }
  .typing-cursor.fade { opacity: 0; }
  @keyframes typingBlink { 50% { opacity: 0; } }

  @keyframes charSlideIn {
    from { transform: translateX(90px); opacity: 0; filter: blur(4px); }
    to { transform: translateX(0); opacity: 1; filter: blur(0); }
  }
  .char-span {
    display: inline-block;
    white-space: pre;
    animation: charSlideIn 1.05s cubic-bezier(.22,1,.36,1) both;
    will-change: transform, opacity, filter;
  }
  .title .char-span { margin-right: .18em; }
  .title .char-span:last-child { margin-right: 0; }

  /* ✅ 修改处2：将智启未来的字体撤下，恢复默认系统字体 */
  .title {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: clamp(64px, 9.5vw, 160px);
    font-weight: 800; /* 恢复原本的 800 粗体 */
    letter-spacing: .18em;
    line-height: 1.05;
    transition: transform 2.2s cubic-bezier(.6,.05,.2,1), opacity 1.9s ease;
  }

  .title .char-span {
    background: linear-gradient(180deg, #eaf4ff 0%, #b8d4f0 28%, #7eaed4 62%, #4d80b0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(90,142,200,.42));

  .subtitle-cn {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: clamp(21px, 1.75vw, 31px);
    letter-spacing: .32em;
    color: #cfeeff;
    font-weight: 500;
    margin-top: 40px;
    padding: .22em 0 .18em 24px;
    text-shadow: 0 0 22px rgba(90,142,200,.5);
    transition: transform 2.2s cubic-bezier(.6,.05,.2,1), opacity 1.9s ease;
    overflow: hidden;
  }
  .subtitle-cn .condense-span {
    display: inline-block;
    white-space: pre;
    margin-right: .32em;
  }
  .subtitle-cn .condense-span:last-child { margin-right: 0; }

  .split-up    { transform: translateY(-60vh) !important; opacity: 0 !important; }
  .split-left  { transform: translateX(-90vw) !important; opacity: 0 !important; }
  .split-right { transform: translateX(90vw) !important;  opacity: 0 !important; }
  .fade-out    { opacity: 0 !important; }
  .cover-top.split-up .club-name { transform: none; }

  #terminal {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, 120%) scale(.96);
    opacity: 0; z-index: 20;
    width: min(90vw, 1360px); height: min(82vh, 880px);
    background: rgba(6, 12, 24, 0.92);
    border: 1px solid rgba(90, 142, 200, 0.4);
    border-radius: 10px;
    box-shadow: 0 0 90px rgba(40, 90, 150, 0.28), 0 0 0 1px rgba(90,142,200,.08), inset 0 0 70px rgba(30, 70, 120, 0.08);
    font-family: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
    display: flex; flex-direction: column; overflow: hidden;
    backdrop-filter: blur(8px);
    transition: transform 1.2s cubic-bezier(.16,.8,.24,1), opacity 1s ease;
  }
  #terminal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  .term-header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 28px;
    background: rgba(10, 20, 36, 0.75);
    border-bottom: 1px solid rgba(90, 142, 200, 0.22);
    flex-shrink: 0;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .dot.red    { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green  { background: #27c93f; }
  .term-title { margin-left: 16px; font-size: 16px; letter-spacing: .18em; color: rgba(140, 180, 220, 0.72); }

  .term-body {
    flex: 1; padding: 38px 46px; overflow-y: auto;
    font-size: 24px; line-height: 1.9; color: #b8d4f0; scroll-behavior: smooth;
  }
  .term-body::-webkit-scrollbar { width: 8px; }
  .term-body::-webkit-scrollbar-thumb { background: rgba(90,142,200,.3); border-radius: 4px; }
  .term-body > div { white-space: pre-wrap; word-break: break-word; }

  .line-log    { color: rgba(120, 160, 200, 0.5); }
  .line-prompt { color: rgba(150, 190, 230, 0.78); }
  .line-question { color: #d8ecff; margin-top: 12px; }
  .line-option { color: #a8c8e8; padding-left: 16px; }
  .line-input  { color: #eaf7ff; }
  .line-success { color: #6fe8a8; margin-top: 12px; }
  .line-error   { color: #ff8a9e; margin-top: 12px; }
  .line-answer  { color: #ffd479; }
  .line-explain { color: rgba(180, 210, 235, 0.78); }
  .line-info    { color: rgba(150, 190, 230, 0.6); }

  .cursor {
    display: inline-block; width: 12px; height: 22px;
    background: #5a8ec8; margin-left: 5px; vertical-align: middle;
    animation: blink .7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 820px) {
    #terminal { width: 94vw; height: 76vh; }
    .term-body { font-size: 18px; padding: 22px; }
    .term-title { font-size: 13px; }
    .cursor { width: 10px; height: 18px; }
    .cover-top { left: 6vw; top: 11vh; gap: 16px; }
    .cover-top img { height: 72px; }
    .club-name { font-size: 32px; letter-spacing: .2em; }
    .title-group { left: 6vw; right: 6vw; top: 51%; }
    .kicker { margin-bottom: 20px; }
    .subtitle-cn { padding-left: 16px; margin-top: 32px; }

    .enter-inner { gap: 22px; }
    .enter-pulse { width: 14px; height: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .enter-inner { animation: none !important; opacity: 1 !important; }
    .enter-pulse { animation: none !important; }
    .char-span   { animation: none !important; opacity: 1 !important;
                   transform: none !important; filter: none !important; }
    .typing-cursor { animation: none !important; }
  }
</style>
</head>

<script>
/* ╔════════════════════════════════════════════════════════════════╗
   ║  ⚙️  全局配置区 —— 改背景色 /改这里                              ║
   ╚════════════════════════════════════════════════════════════════╝ */
var CONFIG = {
  bgColor:        0x1a33,
  bgMouseControls: true,
  bgTouchControls: true,
  bgScale:        1.00,
  bgScaleMobile:  1.00
};

var PREFERS_REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   🚪 进入体验
   ===================================================================== */
var entered = false;
var triggered = false;

function enterFullscreen() {
  var el = document.documentElement;
  var fn = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.msRequestFullscreen;
  if (!fn) return;
  try {
    var r = fn.call(el);
    if (r && typeof r.catch === 'function') r.catch(function () {});
  } catch (e) {}
}

function enterExperience() {
  if (entered) return;
  entered = true;

  enterFullscreen();

  document.getElementById('enterOverlay').classList.add('hidden');

  document.getElementById('cover').classList.add('ready');
  startCoverAnimation();
}

function startCoverAnimation() {
  /* 1) Kicker 打字机 */
  typewrite(
    document.getElementById('kicker'),
    'Brain-Computer Interface',
    { speed: 52, leadDelay: 0.2, cursorHold: 700 }
  );

  /* 2) 主标题：逐字滑入 */
  var splitEls = document.querySelectorAll('[data-split="chars"]');
  for (var i = 0; i < splitEls.length; i++) splitChars(splitEls[i]);

  /* 3) 副标题：从下方凝结浮现 */
  condenseChars(document.getElementById('subtitleCn'), {
    leadDelay: 1.9,
    stagger: 0.04,
    duration: 780
  });
}

/* =====================================================================
   🔤 字体动画工具
   ===================================================================== */
function splitChars(el) {
  var delay = parseFloat(el.dataset.delay || 0);
  var stagger = parseFloat(el.dataset.stagger || 0.04);
  var text = el.textContent;
  el.textContent = '';
  el.style.letterSpacing = '0';
  var ci = 0;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    var span = document.createElement('span');
    span.className = 'char-span';
    span.textContent = (ch === ' ') ? '\u00A0' : ch;
    span.style.animationDelay = (delay + ci * stagger).toFixed(3) + 's';
    el.appendChild(span);
    if (ch !== ' ') ci++;
  }
}

function typewrite(el, text, opt) {
  opt = opt || {};
  var speed      = opt.speed      != null ? opt.speed      : 52;
  var leadDelay  = (opt.leadDelay != null ? opt.leadDelay  : 0)     * 1000;
  var cursorHold = opt.cursorHold != null ? opt.cursorHold : 700;

  el.textContent = '';
  el.setAttribute('aria-label', text);

  var cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  cursor.setAttribute('aria-hidden', 'true');
  el.appendChild(cursor);

  var i = 0;
  function tick() {
    if (i >= text.length) {
      setTimeout(function () {
        cursor.classList.add('fade');
        setTimeout(function () {
          if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
        }, 520);
      }, cursorHold);
      return;
    }
    var ch = text[i];
    cursor.insertAdjacentText('beforebegin', ch);
    i++;
    var next = speed;
    if (ch === ' ') next = speed * 0.4;
    else if (ch === '-') next = speed * 1.4;
    setTimeout(tick, next);
  }
  setTimeout(tick, leadDelay);
}

function condenseChars(el, opt) {
  opt = opt || {};
  var stagger   = (opt.stagger   != null ? opt.stagger   : 0.035) * 1000;
  var duration  =  opt.duration  != null ? opt.duration  : 780;
  var leadDelay = (opt.leadDelay != null ? opt.leadDelay : 0)     * 1000;

  var text = el.textContent;
  el.setAttribute('aria-label', text);
  el.textContent = '';
  el.style.letterSpacing = '0';

  var spans = [];
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    var s = document.createElement('span');
    s.className = 'condense-span';
    s.setAttribute('aria-hidden', 'true');
    s.textContent = (ch === ' ') ? '\u00A0' : ch;

    s.style.transform = 'translateY(130%)';
    s.style.opacity   = '0';
    s.style.filter    = 'blur(6px)';
    s.style.willChange = 'transform, opacity, filter';

    el.appendChild(s);
    spans.push(s);
  }

  if (PREFERS_REDUCED) {
    for (var r = 0; r < spans.length; r++) {
      spans[r].style.transform = 'none';
      spans[r].style.filter    = 'none';
      spans[r].style.opacity   = '1';
      spans[r].style.removeProperty('will-change');
    }
    return;
  }

  var t0 = performance.now();
  var total = leadDelay + spans.length * stagger + duration;

  function frame(now) {
    var elapsed = now - t0;
    for (var k = 0; k < spans.length; k++) {
      var local = elapsed - (leadDelay + k * stagger);
      if (local <= 0) continue;
      var p = Math.min(local / duration, 1);
      var e = 1 - Math.pow(1 - p, 4);
      var y    = (1 - e) * 130;
      var blur = (1 - e) * 6;
      spans[k].style.transform = 'translateY(' + y + '%)';
      spans[k].style.opacity   = e;
      spans[k].style.filter    = 'blur(' + blur + 'px)';
    }
    if (elapsed < total) {
      requestAnimationFrame(frame);
    } else {
      for (var m = 0; m < spans.length; m++) {
        spans[m].style.removeProperty('will-change');
        spans[m].style.transform = 'none';
        spans[m].style.filter    = 'none';
        spans[m].style.opacity   = '1';
      }
    }
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   🎬 初始化
   ===================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  VANTA.WAVES({
    el: "#vanta-bg",
    mouseControls: CONFIG.bgMouseControls,
    touchControls: CONFIG.bgTouchControls,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: CONFIG.bgScale,
    scaleMobile: CONFIG.bgScaleMobile,
    color: CONFIG.bgColor
  });

  var overlay = document.getElementById('enterOverlay');
  overlay.addEventListener('click', enterExperience);
  overlay.addEventListener('touchstart', enterExperience, { passive: true });
});

/* ============ 1. 题目数据（20 题） ============ */
var questions = [
  { question: "脑机接口（BCI）的完整英文名称是？",
    options: ["Brain-Computer Interface", "Biological Control Instrument", "Brain Central Integration", "Binary Code Interface"],
    answer: 0, explanation: "BCI 是 Brain-Computer Interface 的缩写，指在大脑与外部设备之间建立直接通信与控制通道。" },

  { question: "脑机接口研究中最经典的非侵入式信号采集方式是？",
    options: ["头皮脑电图 EEG", "功能性磁共振 fMRI", "颅内电极阵列", "正电子发射断层扫描 PET"],
    answer: 0, explanation: "EEG 通过头皮电极记录脑电活动，无需手术，是最常用的非侵入式 BCI 信号来源。" },

  { question: "“思想钢印”出自哪部科幻作品？",
    options: ["《阿凡达》", "《三体》", "《沙丘》", "《星际穿越》"],
    answer: 1, explanation: "《三体》中的“思想钢印”设想通过脑机设备直接改写人类信念。" },

  { question: "脑机接口系统中的“解码端”主要功能是？",
    options: ["捕捉神经信号", "用算法翻译信号，识别意图", "执行动作指令", "提供感官反馈"],
    answer: 1, explanation: "解码端通过算法对采集到的神经信号进行翻译和分类，识别使用者意图。" },

  { question: "2016 年内森·科普兰的“意念握手”实验中，双向闭环主要体现在？",
    options: [
      "患者用意念控制机械臂，但未涉及感觉反馈",
      "机械臂压力信号传回大脑，患者产生触觉",
      "患者通过脑电信号控制机械臂的运动方向",
      "信号采集端记录到了患者大脑的运动皮层信号"
    ],
    answer: 1, explanation: "机械臂传感器把压力信号传回大脑，让患者产生触觉，形成双向闭环。" },

  { question: "2016 年“意念握手”相比 2004 年 BrainGate，主要突破在于？",
    options: ["实现了人体长期植入", "实现了双向闭环和触觉反馈", "首次记录到人类脑电", "首次提出脑机接口概念"],
    answer: 1, explanation: "2004 年实现长期植入，2016 年进一步实现双向闭环和触觉反馈。" },

  { question: "1973 年，谁正式提出“脑机接口（BCI）”概念？",
    options: ["汉斯·伯格", "雅克·维达尔", "内森·科普兰", "奥巴马"],
    answer: 1, explanation: "雅克·维达尔在 1973 年正式提出脑机接口概念，并设计了首个相关系统。" },

  { question: "2004 年 BrainGate 临床试验中，马修·纳格尔植入的电极阵列通道数和主要成果是？",
    options: ["16 通道，控制电视", "96 通道，发送邮件、控制机械臂", "64 通道，打乒乓球", "128 通道，进食喝水"],
    answer: 1, explanation: "马修·纳格尔植入 96 通道电极阵列，成功用意念发送邮件并控制机械臂等设备。" },

  { question: "2004 年马修·纳格尔成功用意念做到的事情不包括？",
    options: ["发送邮件", "控制电视", "控制机械臂", "用意念打乒乓球"],
    answer: 3, explanation: "用意念打乒乓球是 2021 年 Neuralink 猴子实验，不属于 2004 年 BrainGate 案例。" },

  { question: "2004 年 BrainGate 的意义是什么？",
    options: ["首次提出 BCI 概念", "首次实现人体长期植入临床应用", "首次检测到脑电", "首次实现触觉反馈"],

/* ============ 2. 状态与工具 ============ */
var quizToken = 0;
var awaitingInput = false;
var inputBuffer = '';
var inputResolve = null;

var termBody = document.getElementById('termBody');

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function scrollBottom() { termBody.scrollTop = termBody.scrollHeight; }
function appendLine(text, className) {
  var el = document.createElement('div');
  el.textContent = text || '';
  if (className) el.className = className;
  termBody.appendChild(el);
  scrollBottom();
  return el;
}
async function typeLine(el, text, speed, tk) {
  for (var i = 0; i < text.length; i++) {
    if (tk !== quizToken) return false;
    el.textContent += text[i];
    scrollBottom();
    await sleep(speed);
  }
  return true;
}
async function typeNewLine(text, speed, className, tk) {
  var el = appendLine('', className);
  return await typeLine(el, text, speed, tk);
}

/* ============ 3. 输入处理 ============ */
function waitForInput(tk) {
  return new Promise(function (resolve) {
    awaitingInput = true;
    inputBuffer = '';
    renderInputLine();
    inputResolve = function (payload) {
      if (tk !== quizToken) { resolve(null); return; }
      awaitingInput = false;
      inputResolve = null;
      resolve(payload);
    };
  });
}

var inputLineEl = null;
function renderInputLine() {
  if (!inputLineEl) {
    inputLineEl = document.createElement('div');
    inputLineEl.className = 'line-input';
    termBody.appendChild(inputLineEl);
  }
  inputLineEl.innerHTML = '';
  var prompt = document.createElement('span');
  prompt.textContent = '>>> ';
  inputLineEl.appendChild(prompt);
  var typed = document.createElement('span');
  typed.textContent = inputBuffer;
  inputLineEl.appendChild(typed);
  var cur = document.createElement('span');
  cur.className = 'cursor';
  inputLineEl.appendChild(cur);
  scrollBottom();
}

function finalizeInputLine(value) {
  if (!inputLineEl) return;
  inputLineEl.innerHTML = '';
  var prompt = document.createElement('span');
  prompt.textContent = '>>> ';
  inputLineEl.appendChild(prompt);
  var typed = document.createElement('span');
  typed.textContent = value;
  inputLineEl.appendChild(typed);
  inputLineEl = null;
  scrollBottom();
}

/* ============ 4. 主流程 ============ */
async function runQuiz(tk) {
  var logs = [
    '[ OK ] neural-interface v1.0 loaded',
    '[ OK ] cortex scan channel online',
    '[ OK ] spike sorting module ready',
    '[ .. ] decoding motor imagery ...',
    ''
  ];
  for (var i = 0; i < logs.length; i++) {
    if (tk !== quizToken) return;
    await typeNewLine(logs[i], 16, 'line-log', tk);
    await sleep(140);
  }

  await typeNewLine('> 神经信号通道 已建立', 24, 'line-prompt', tk);
  await sleep(240);

  await showBrainFetching(tk);

  await typeNewLine('> 获取成功', 24, 'line-success', tk);
  await sleep(400);

  var letters = ['A', 'B', 'C', 'D'];

  var qi = 0;
  while (qi >= 0 && qi < questions.length) {
    if (tk !== quizToken) return;
    var q = questions[qi];

    await typeNewLine('> QUESTION ' + (qi + 1) + ' / ' + questions.length, 28, 'line-prompt', tk);
    await sleep(180);

    await typeNewLine(q.question, 32, 'line-question', tk);
    await sleep(200);

    for (var j = 0; j < q.options.length; j++) {
      if (tk !== quizToken) return;
      await typeNewLine('  ' + letters[j] + '.  ' + q.options[j], 18, 'line-option', tk);
      await sleep(80);
    }
    await sleep(150);

    var answerIdx = -1;
    var jumpTo = -1;
    while (answerIdx < 0 && jumpTo < 0) {
      if (tk !== quizToken) return;
      var payload = await waitForInput(tk);
      if (payload === null) return;

      if (payload.jump !== undefined) {
        var t = payload.jump;
        if (t >= 1 && t <= questions.length) {
          jumpTo = t;
        } else {
          await typeNewLine('  ⚠ 题号超出范围（有效：1 - ' + questions.length + '）', 20, 'line-error', tk);
          await sleep(400);
        }
      } else if (payload.answer !== undefined) {
        answerIdx = payload.answer;
      }
    }

    if (jumpTo > 0) {
      await showJumping(tk, jumpTo);
      qi = jumpTo - 1;
      continue;
    }

    var isCorrect = (answerIdx === q.answer);

    await sleep(200);
    if (isCorrect) {
      await typeNewLine('✓ 恭喜回答正确，请工作人员送上奖品', 24, 'line-success', tk);
    } else {
      await typeNewLine('✕ 很遗憾，不够细心，没有选对。', 24, 'line-error', tk);
    }
    await sleep(280);

    await typeNewLine('  正确答案：' + letters[q.answer] + '. ' + q.options[q.answer], 22, 'line-answer', tk);
    await sleep(200);

    await typeNewLine('  解析：' + q.explanation, 20, 'line-explain', tk);
    await sleep(300);

    if (qi < questions.length - 1) {
      await showLoading(tk);
    }

    qi++;
  }

  if (tk !== quizToken) return;
  await typeNewLine('', 1, 'line-info', tk);
  await typeNewLine('=== 全部题目已完成 ===', 28, 'line-success', tk);
  await typeNewLine('感谢参与，让我们继续深入探索脑机接口。', 24, 'line-info', tk);
}

async function showBrainFetching(tk) {
  var el = appendLine('', 'line-prompt');
  var prefix = '> 正在从大脑获取信息';
  var frames = ['   ', '.  ', '.. ', '...'];
  var start = performance.now();
  var duration = 1800;
  while (performance.now() - start < duration) {
    if (tk !== quizToken) return;
    var k = Math.floor((performance.now() - start) / 220) % 4;
    el.textContent = prefix + frames[k];
    scrollBottom();
    await sleep(110);
  }
  el.textContent = prefix + '...';
  scrollBottom();
}

async function showLoading(tk) {
  var el = appendLine('', 'line-info');
  var prefix = '> 正在准备下一题';
  var frames = ['   ', '.  ', '.. ', '...'];
  var start = performance.now();
  var duration = 1600;
  while (performance.now() - start < duration) {
    if (tk !== quizToken) return;
    var k = Math.floor((performance.now() - start) / 200) % 4;
    el.textContent = prefix + frames[k];
    scrollBottom();
    await sleep(100);
  }
  el.textContent = prefix + ' 完成';
  await sleep(200);
}

async function showJumping(tk, target) {
  var el = appendLine('', 'line-prompt');
  var prefix = '> 正在跳转到第 ' + target + ' 题';
  var frames = ['   ', '.  ', '.. ', '...'];
  var start = performance.now();
  var duration = 1400;
  while (performance.now() - start < duration) {
    if (tk !== quizToken) return;
    var k = Math.floor((performance.now() - start) / 200) % 4;
    el.textContent = prefix + frames[k];
    scrollBottom();
    await sleep(100);
  }
  el.textContent = prefix + '...';
  scrollBottom();
  await sleep(300);
}

/* ============ 5. 全屏控制 ============ */
function toggleFullscreen() {
  var el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  } else {
    var fx = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fx) { try { fx.call(document); } catch (e) {} }
  }
}

/* ============ 6. 键盘输入 ============ */
window.addEventListener('keydown', function (e) {

  if (!entered) {
    e.preventDefault();
    enterExperience();
    return;
  }

  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    toggleFullscreen();
    return;
  }

  if (e.key === 'ArrowUp' && triggered) {
    e.preventDefault();
    backToCover();
    return;
  }

  if (e.code === 'Space' && !triggered) {
    e.preventDefault();
    startScene();
    return;
  }

  if (awaitingInput) {
    if (e.key.length === 1 && /[a-dA-D0-9]/.test(e.key)) {
      e.preventDefault();
      if (inputBuffer.length < 2) {
        inputBuffer += e.key.toUpperCase();
        renderInputLine();
      }
      return;
    }
    if (e.key === 'Backspace') {
      e.preventDefault();
      inputBuffer = inputBuffer.slice(0, -1);
      renderInputLine();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (inputBuffer.length === 0) return;

      var val = inputBuffer.toUpperCase();
      var payload = null;

      if (/^\d{1,2}$/.test(val)) {
        payload = { jump: parseInt(val, 10) };
      } else if (/^[A-D]$/.test(val)) {
        payload = { answer: val.charCodeAt(0) - 65 };
      } else {
        return;
      }

      finalizeInputLine(val);
      var r = inputResolve;
      inputResolve = null;
      awaitingInput = false;
      if (r) r(payload);
      return;
    }
    return;
  }
});

/* ============ 7. 场景切换 ============ */
function startScene() {
  if (triggered) return;
  triggered = true;
  quizToken++;
  var tk = quizToken;

  document.getElementById('coverTop').classList.add('split-up');
  document.getElementById('kicker').classList.add('split-up');
  document.getElementById('title').classList.add('split-left');
  document.getElementById('subtitleCn').classList.add('split-right');
  document.getElementById('cover').classList.add('done');

  setTimeout(function () {
    if (tk !== quizToken) return;
    document.getElementById('terminal').classList.add('show');
  }, 650);

  setTimeout(function () {
    if (tk !== quizToken) return;
    termBody.innerHTML = '';
    runQuiz(tk);
  }, 1900);
}

function backToCover() {
  if (!triggered) return;
  triggered = false;
  quizToken++;

  if (inputResolve) { var r = inputResolve; inputResolve = null; awaitingInput = false; r(null); }
  inputLineEl = null;

  document.getElementById('terminal').classList.remove('show');

  setTimeout(function () {
    document.getElementById('coverTop').classList.remove('split-up');
    document.getElementById('kicker').classList.remove('split-up');
    document.getElementById('title').classList.remove('split-left');
    document.getElementById('subtitleCn').classList.remove('split-right');
    document.getElementById('cover').classList.remove('done');
  }, 500);
}

window.addEventListener('wheel', function (e) {
  if (!entered) { enterExperience(); return; }
  if (!triggered && e.deltaY > 0) startScene();
}, { passive: true });

var touchStartY = 0;
window.addEventListener('touchstart', function (e) {
  if (!entered) { enterExperience(); return; }
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', function (e) {
  if (!entered || triggered) return;
  var dy = touchStartY - e.touches[0].clientY;
  if (dy > 40) startScene();
}, { passive: true });
</script>
